<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Studio ice-blue backdrop matching the other 3 hero renders -->
    <radialGradient id="studioBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#f5faff" />
      <stop offset="55%" stop-color="#e5f0fb" />
      <stop offset="100%" stop-color="#d4e4f5" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="36%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="navyCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17385f" />
      <stop offset="100%" stop-color="#0b1f3a" />
    </linearGradient>

    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#eef7ff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#d4ebfd" stop-opacity="0.68" />
    </linearGradient>

    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="skyPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25" />
    </linearGradient>

    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#0f2b4c" flood-opacity="0.16" />
    </filter>

    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f2b4c" flood-opacity="0.14" />
    </filter>

    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="1600" height="900" fill="url(#studioBg)" />
  <ellipse cx="800" cy="430" rx="560" ry="310" fill="url(#centerGlow)" />

  <!-- Ground Soft Ambient Shadows -->
  <ellipse cx="800" cy="748" rx="340" ry="34" fill="#0f2b4c" opacity="0.11" filter="url(#blurGlow)" />
  <ellipse cx="360" cy="680" rx="140" ry="22" fill="#0f2b4c" opacity="0.08" filter="url(#blurGlow)" />
  <ellipse cx="1245" cy="680" rx="145" ry="22" fill="#0f2b4c" opacity="0.08" filter="url(#blurGlow)" />

  <!-- Orbital Data Rings & Luminous Pipelines -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="800" cy="455" rx="455" ry="190" stroke="#0284c7" stroke-opacity="0.14" stroke-width="3" stroke-dasharray="10 14" />
    <ellipse cx="800" cy="455" rx="330" ry="135" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2.5" />

    <!-- Curved connecting pipelines from central cloud hub to 4 floating SaaS modules -->
    <path d="M 650 385 C 555 340, 495 305, 435 280" stroke="url(#pipeGrad)" stroke-width="5" />
    <path d="M 950 385 C 1045 340, 1105 305, 1165 280" stroke="url(#pipeGrad)" stroke-width="5" />
    <path d="M 645 495 C 545 535, 480 565, 425 585" stroke="url(#pipeGrad)" stroke-width="5" />
    <path d="M 955 495 C 1055 535, 1120 565, 1175 585" stroke="url(#pipeGrad)" stroke-width="5" />

    <!-- Glowing data pulse nodes -->
    <circle cx="538" cy="332" r="8" fill="#38bdf8" />
    <circle cx="1062" cy="332" r="8" fill="#38bdf8" />
    <circle cx="534" cy="542" r="8" fill="#34d399" />
    <circle cx="1066" cy="542" r="8" fill="#38bdf8" />
  </g>

  <!-- Central Glassmorphic Cloud Platform Base -->
  <g filter="url(#softShadow)">
    <!-- Deep Navy Platform Pedestal -->
    <rect x="570" y="340" width="460" height="275" rx="34" fill="url(#navyCard)" />
    <rect x="574" y="344" width="452" height="267" rx="31" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="2" />

    <!-- Top Window Bar Dots -->
    <circle cx="608" cy="374" r="7" fill="#38bdf8" />
    <circle cx="632" cy="374" r="7" fill="#7dd3fc" opacity="0.7" />
    <circle cx="656" cy="374" r="7" fill="#34d399" opacity="0.85" />
    <rect x="705" y="366" width="190" height="16" rx="8" fill="#ffffff" opacity="0.14" />

    <!-- Frosted Glass Inner Stage -->
    <rect x="598" y="402" width="404" height="186" rx="22" fill="url(#glassSurface)" stroke="url(#glassStroke)" stroke-width="2" />

    <!-- Sculpted 3D Cloud Core hovering inside/above central stage -->
    <g transform="translate(800 375)">
      <ellipse cx="0" cy="118" rx="115" ry="20" fill="#0284c7" opacity="0.18" />
      <path
        d="M -98 86
           C -136 86, -162 58, -162 24
           C -162 -8, -138 -34, -106 -38
           C -94 -84, -52 -116, -2 -116
           C 54 -116, 100 -76, 108 -24
           C 142 -18, 166 10, 166 42
           C 166 70, 140 86, 106 86 Z"
        fill="url(#cloudGrad)"
        stroke="#ffffff"
        stroke-width="4"
      />
      <!-- Inner Luminous Cloud Core Badge -->
      <rect x="-46" y="-26" width="92" height="72" rx="20" fill="url(#skyPill)" />
      <!-- Sync / API Arrows Symbol (no text) -->
      <path d="M -18 10 A 18 18 0 0 1 14 -2 M 18 10 A 18 18 0 0 1 -14 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <polyline points="10,-10 18,-1 8,4" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="-10,30 -18,21 -8,16" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Bottom Status Pills inside Central Stage -->
    <rect x="638" y="534" width="96" height="22" rx="11" fill="url(#skyPill)" opacity="0.88" />
    <rect x="752" y="534" width="96" height="22" rx="11" fill="#0f2b4c" opacity="0.78" />
    <rect x="866" y="534" width="96" height="22" rx="11" fill="url(#emeraldPill)" opacity="0.88" />
  </g>

  <!-- Module 1 (Top-Left): Modular App Blocks Card -->
  <g filter="url(#cardShadow)" transform="translate(210 165)">
    <rect width="235" height="162" rx="24" fill="url(#glassSurface)" stroke="url(#glassStroke)" stroke-width="2.5" />
    <rect x="22" y="22" width="52" height="52" rx="15" fill="url(#navyCard)" />
    <rect x="33" y="33" width="13" height="13" rx="3.5" fill="#38bdf8" />
    <rect x="50" y="33" width="13" height="13" rx="3.5" fill="#7dd3fc" opacity="0.7" />
    <rect x="33" y="50" width="13" height="13" rx="3.5" fill="#7dd3fc" opacity="0.7" />
    <rect x="50" y="50" width="13" height="13" rx="3.5" fill="#34d399" />

    <rect x="92" y="30" width="112" height="14" rx="7" fill="#0f2b4c" opacity="0.82" />
    <rect x="92" y="54" width="78" height="10" rx="5" fill="#0284c7" opacity="0.35" />

    <rect x="22" y="96" width="191" height="16" rx="8" fill="#0284c7" opacity="0.16" />
    <rect x="22" y="96" width="132" height="16" rx="8" fill="url(#skyPill)" />
    <rect x="22" y="124" width="191" height="14" rx="7" fill="#0f2b4c" opacity="0.12" />
    <rect x="22" y="124" width="96" height="14" rx="7" fill="url(#emeraldPill)" />
  </g>

  <!-- Module 2 (Top-Right): Cloud Security Shield Card -->
  <g filter="url(#cardShadow)" transform="translate(1155 165)">
    <rect width="235" height="162" rx="24" fill="url(#glassSurface)" stroke="url(#glassStroke)" stroke-width="2.5" />
    <circle cx="62" cy="81" r="40" fill="url(#skyPill)" opacity="0.16" />
    <!-- Shield icon -->
    <path d="M 62 47 L 90 58 V 82 C 90 101 77 114 62 120 C 47 114 34 101 34 82 V 58 Z" fill="url(#navyCard)" />
    <polyline points="50,82 59,91 75,72" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="116" y="48" width="92" height="14" rx="7" fill="#0f2b4c" opacity="0.82" />
    <rect x="116" y="74" width="76" height="12" rx="6" fill="url(#skyPill)" opacity="0.8" />
    <rect x="116" y="98" width="60" height="12" rx="6" fill="url(#emeraldPill)" opacity="0.85" />
  </g>

  <!-- Module 3 (Bottom-Left): Multi-Tenant Database Stack Card -->
  <g filter="url(#cardShadow)" transform="translate(200 535)">
    <rect width="245" height="168" rx="24" fill="url(#glassSurface)" stroke="url(#glassStroke)" stroke-width="2.5" />
    <!-- Stacked 3D Database Cylinders -->
    <g transform="translate(30 34)">
      <rect x="0" y="64" width="76" height="32" rx="12" fill="#0f2b4c" />
      <ellipse cx="38" cy="64" rx="38" ry="12" fill="#1e4976" />
      <rect x="0" y="34" width="76" height="30" rx="12" fill="#0284c7" />
      <ellipse cx="38" cy="34" rx="38" ry="12" fill="#38bdf8" />
      <rect x="0" y="8" width="76" height="26" rx="12" fill="#38bdf8" />
      <ellipse cx="38" cy="8" rx="38" ry="12" fill="#bae6fd" />
    </g>

    <!-- Metric Bars -->
    <rect x="128" y="42" width="92" height="14" rx="7" fill="#0f2b4c" opacity="0.82" />
    <rect x="128" y="68" width="72" height="10" rx="5" fill="#0284c7" opacity="0.35" />
    <g transform="translate(128 96)">
      <rect x="0" y="24" width="16" height="24" rx="5" fill="#bae6fd" />
      <rect x="24" y="14" width="16" height="34" rx="5" fill="#38bdf8" />
      <rect x="48" y="4" width="16" height="44" rx="5" fill="#0284c7" />
      <rect x="72" y="10" width="16" height="38" rx="5" fill="#34d399" />
    </g>
  </g>

  <!-- Module 4 (Bottom-Right): Multi-Device Sync & Growth Card -->
  <g filter="url(#cardShadow)" transform="translate(1155 535)">
    <rect width="245" height="168" rx="24" fill="url(#glassSurface)" stroke="url(#glassStroke)" stroke-width="2.5" />
    <!-- Mini Dashboard Screen -->
    <rect x="22" y="24" width="128" height="92" rx="16" fill="url(#navyCard)" />
    <circle cx="40" cy="40" r="4" fill="#38bdf8" />
    <circle cx="53" cy="40" r="4" fill="#34d399" />
    <path d="M 38 94 Q 62 66, 86 78 T 134 52" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="134" cy="52" r="6" fill="#34d399" />

    <!-- Companion Mobile Card -->
    <rect x="164" y="42" width="58" height="102" rx="14" fill="#ffffff" stroke="#7dd3fc" stroke-width="2.5" />
    <rect x="176" y="56" width="34" height="10" rx="5" fill="#0f2b4c" opacity="0.8" />
    <rect x="176" y="76" width="34" height="28" rx="7" fill="url(#skyPill)" opacity="0.85" />
    <rect x="176" y="114" width="24" height="10" rx="5" fill="url(#emeraldPill)" />

    <rect x="22" y="130" width="128" height="14" rx="7" fill="#0284c7" opacity="0.2" />
    <rect x="22" y="130" width="88" height="14" rx="7" fill="url(#skyPill)" />
  </g>
</svg>
